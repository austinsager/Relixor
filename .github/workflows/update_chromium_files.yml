name: 'Chromium: Update files from upstream'

on:
  workflow_dispatch:
    inputs:
      NEW_CHROMIUM_MAJOR:
        description: 'Major version of Chromium'     
        required: true
        default: '93'
      NEW_CHROMIUM_MINOR:
        description: 'Minor version of Chromium'     
        required: true
        default: '0'
      NEW_CHROMIUM_BUILD:
        description: 'Build version of Chromium'     
        required: true
        default: '4577'
      NEW_CHROMIUM_PATCH:
        description: 'Patch version of Chromium'     
        required: true
        default: '25'

permissions:
  contents: write       # Required to checkout branch and push code
  pull-requests: write  # Required by create-pull-request action

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Disable Git auto-packing
        run: git config --global gc.auto 0
        
      - name: Setting-up GitHub username
        run: |
          git config --global user.email "github@actions"
          git config --global user.name "Repository manager"
          
      - name: Disabling Git pager (e.g. for git log)
        run: git config --global core.pager 'cat'

      - name: Preparing local Chromium branch
        run: git switch chromium

      - name: Loading settings from CHROMIUM_VERSION
        run: |
          if [ -f "CHROMIUM_VERSION" ]; then
            while IFS='=' read -r key value; do
              case "$key" in
                ''|\#*) continue ;;
              esac
              echo "$key=$value" >> "$GITHUB_ENV"
            done < CHROMIUM_VERSION
          fi

      - name: Listing source files
        run: find . -type f | sed 's#\./#/#g' | grep -vFi '.gitignore' > /tmp/source_files.txt
        
      - name: Checking out Chromium
        run: git clone --filter=tree:0 --no-checkout https://github.com/chromium/chromium.git /tmp/chromium_new

      - name: Limiting the list of files to checkout
        run: cd /tmp/chromium_new && git sparse-checkout set --stdin < /tmp/source_files.txt

      - name: Switching Chromium to new version
        env:
          NEW_VERSION: "${{ github.event.inputs.NEW_CHROMIUM_MAJOR }}.${{ github.event.inputs.NEW_CHROMIUM_MINOR }}.${{ github.event.inputs.NEW_CHROMIUM_BUILD }}.${{ github.event.inputs.NEW_CHROMIUM_PATCH }}"
        run: cd /tmp/chromium_new && git read-tree -mu "$NEW_VERSION"

      - name: Copying files to local Chromium branch
        run: rsync -avz --progress --exclude=".git" /tmp/chromium_new/* .

      - name: Adding files to local Chromium branch
        run: git add .

      - name: Updating CHROMIUM_VERSION file
        env:
          MAJOR: ${{ github.event.inputs.NEW_CHROMIUM_MAJOR }}
          MINOR: ${{ github.event.inputs.NEW_CHROMIUM_MINOR }}
          BUILD: ${{ github.event.inputs.NEW_CHROMIUM_BUILD }}
          PATCH: ${{ github.event.inputs.NEW_CHROMIUM_PATCH }}
        run: |
          {
            echo "CHROMIUM_MAJOR=$MAJOR"
            echo "CHROMIUM_MINOR=$MINOR"
            echo "CHROMIUM_BUILD=$BUILD"
            echo "CHROMIUM_PATCH=$PATCH"
          } > CHROMIUM_VERSION

      - name: Set PR variables
        env:
          NEW_VER: "${{ github.event.inputs.NEW_CHROMIUM_MAJOR }}.${{ github.event.inputs.NEW_CHROMIUM_MINOR }}.${{ github.event.inputs.NEW_CHROMIUM_BUILD }}.${{ github.event.inputs.NEW_CHROMIUM_PATCH }}"
        run: |
          echo "NEW_VERSION=$NEW_VER" >> "$GITHUB_ENV"
          if [ -n "${CHROMIUM_MAJOR:-}" ]; then
            # shellcheck disable=SC2153
            echo "OLD_VERSION=${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}" >> "$GITHUB_ENV"
          else
            echo "OLD_VERSION=Unknown" >> "$GITHUB_ENV"
          fi

      - name: Creating pull request
        id: pullrequest
        uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
        with:
          branch: chromium_${{ env.NEW_VERSION }}
          base: chromium
          delete-branch: true
          signoff: true
          title: "Update Chromium version ${{ env.OLD_VERSION }} to ${{ env.NEW_VERSION }}"
          commit-message: "[Chromium] Update version ${{ env.OLD_VERSION }} to ${{ env.NEW_VERSION }}"
          body: Version update initiated by ${{ github.actor }}

      - name: Getting pull request URL
        run: |
          echo "Pull request number - ${{ steps.pullrequest.outputs.pull-request-number }}"
          echo "Pull request URL - ${{ steps.pullrequest.outputs.pull-request-url }}"

