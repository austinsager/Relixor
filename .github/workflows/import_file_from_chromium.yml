#checkov:skip=CKV_GHA_7:Admin-only manual input is required to choose which Chromium file path to import
# Import a file from Chromium, relative path to https://source.chromium.org/chromium/chromium/src
# In case the file is in a drawable-* folder (e.g. drawable-mdpi), all the adjacent (mdpi, xhdpi, etc) assets for the same file will be imported.
name: "Chromium: Import file"

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path in Chromium repository"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Disable Git auto-packing
        run: git config --global gc.auto 0

      - name: Setting-up GitHub username
        run: |
          git config --global user.email "github@actions"
          git config --global user.name "Repository manager"

      - name: Preparing local Chromium branch
        run: git switch chromium

      - name: Loading settings from CHROMIUM_VERSION
        run: |
          while IFS='=' read -r key value; do
            case "$key" in
              ''|\#*) continue ;;
            esac
            echo "$key=$value" >> "$GITHUB_ENV"
          done < CHROMIUM_VERSION

      - name: Validate Chromium file path input
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
        run: |
          if [ -z "$FILE_PATH" ] || [ "${FILE_PATH#/}" != "$FILE_PATH" ] || [ "${FILE_PATH#../}" != "$FILE_PATH" ] || [[ "$FILE_PATH" == *"/../"* ]] || [[ "$FILE_PATH" == *".." ]] || [[ "$FILE_PATH" == *$'\n'* ]]; then
            echo "::error::Invalid file path: $FILE_PATH"
            exit 1
          fi

      - name: Downloading file
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
          CHROMIUM_MAJOR: ${{ env.CHROMIUM_MAJOR }}
          CHROMIUM_MINOR: ${{ env.CHROMIUM_MINOR }}
          CHROMIUM_BUILD: ${{ env.CHROMIUM_BUILD }}
          CHROMIUM_PATCH: ${{ env.CHROMIUM_PATCH }}
        run: wget "https://chromium.googlesource.com/chromium/src/+/refs/tags/${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}/${FILE_PATH}?format=TEXT" -O /tmp/file.txt

      - name: Creating folder where the file is stored
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
        run: mkdir -p "$(dirname "${FILE_PATH}")"

      - name: Decoding file
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
        run: base64 --decode < /tmp/file.txt > "${FILE_PATH}"

      - name: Adding file to Git repository
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
        run: git add "${FILE_PATH}"

      - name: Importing assets from adjacent folders (if it's an image)
        if: contains(github.event.inputs.path, 'drawable-') || contains(github.event.inputs.path, 'mipmap-')
        continue-on-error: true
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
          CHROMIUM_MAJOR: ${{ env.CHROMIUM_MAJOR }}
          CHROMIUM_MINOR: ${{ env.CHROMIUM_MINOR }}
          CHROMIUM_BUILD: ${{ env.CHROMIUM_BUILD }}
          CHROMIUM_PATCH: ${{ env.CHROMIUM_PATCH }}
        run: |
          for image_folder in drawable mipmap
          do
            for resolution_folder in mdpi hdpi xhdpi xxhdpi xxxhdpi
            do
              echo "Processing ${image_folder}-${resolution_folder}"
              adjacent_target_file=$(echo "${FILE_PATH}" | sed -E "s#(\-mdpi|\-hdpi|\-xhdpi|\-xxhdpi|\-xxxhdpi)/#-${resolution_folder}/#g")
              rm -f /tmp/file.txt
              
              if wget "https://chromium.googlesource.com/chromium/src/+/refs/tags/${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}/${adjacent_target_file}?format=TEXT" -O /tmp/file.txt; then
                mkdir -p "$(dirname "${adjacent_target_file}")"
                base64 --decode < /tmp/file.txt > "${adjacent_target_file}"
                git add "${adjacent_target_file}"
              fi
            done
          done

      - name: Committing file(s)
        env:
          FILE_PATH: ${{ github.event.inputs.path }}
        run: git commit --allow-empty -a -m "[Chromium] Importing ${FILE_PATH} from version ${{ env.CHROMIUM_MAJOR }}.${{ env.CHROMIUM_MINOR }}.${{ env.CHROMIUM_BUILD }}.${{ env.CHROMIUM_PATCH }}"

      - name: Pushing repository
        run: git push origin chromium
