# Build APKs for Relixor Browser (Standalone Compilation)
name: 'Kiwi: Build and sign release apk'

on:
  workflow_dispatch:
    inputs:
      prepareRelease:
        description: 'Create a draft release in Google Play Store'     
        required: true
        default: 'no'
      announceOnMessengers:
        description: 'Announce new release on Discord and Telegram channels'     
        required: true
        default: 'yes'

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 
      matrix:
        platform: [arm64] 

    steps:
      - name: Initializing build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "Initializing build for platform $PLATFORM"

      - name: Updating APT repository
        run: sudo apt-get update

      - name: Installing build dependencies
        run: sudo apt-get install -y 2to3 python3-minimal python3 dh-python python-is-python3 openjdk-8-jdk-headless libncurses6 ccache jq ninja-build

      - name: Reclaiming disk space on /
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android

      - name: Checking-out source-code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Creating secondary disk folder
        run: |
          sudo mkdir -p /extended_data
          sudo chown -R runner:docker /extended_data
          sudo ln -s /extended_data /mnt/secondary_disk
          sudo ln -s /mnt/secondary_disk "$GITHUB_WORKSPACE/"

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.platform }}-

      - name: Creating output folder
        env:
          PLATFORM: ${{ matrix.platform }}
        run: mkdir -p "secondary_disk/out/android_${PLATFORM}"

      - name: Generating one-time APK signature key
        run: keytool -genkey -v -keystore keystore.jks -alias dev -keyalg RSA -keysize 2048 -validity 10000 -storepass public_password -keypass public_password -dname "cn=Relixor Browser (unverified), ou=Actions, o=Relixor Browser, c=GitHub"

      - name: Copying args.gn to target folder
        env:
          RUN_ID: ${{ github.run_id }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          sed -e "s#target_cpu = \".*\"#target_cpu = \"${PLATFORM}\"#" \
              -e "s#android_default_version_name = \"Git\"#android_default_version_name = \"Git$(date '+%y%m%d')Gen${RUN_ID}\"#" \
              .build/production_build_reference/args.gn > "secondary_disk/out/android_${PLATFORM}/args.gn"

      - name: Modifying args.gn version code
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            arm)   CODE="1" ;;
            arm64) CODE="2" ;;
            x86)   CODE="3" ;;
            x64)   CODE="4" ;;
          esac
          sed -i "s#android_default_version_code = \"1\"#android_default_version_code = \"$(date '+%y%m%d')${CODE}\"#" "secondary_disk/out/android_${PLATFORM}/args.gn"

      - name: Install depot_tools and Direct GN Binary
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"
          
          # Directly download the official precompiled Linux GN binary to satisfy depot_tools wrapper requirements
          mkdir -p "$HOME/gn_bin"
          curl -L https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -o "$HOME/gn_bin/gn" || true
          chmod +x "$HOME/gn_bin/gn"
          echo "$HOME/gn_bin" >> "$GITHUB_PATH"

      - name: Generate Ninja files (gn gen)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          export PATH="$HOME/gn_bin:$HOME/depot_tools:$PATH"
          gn gen "secondary_disk/out/android_${PLATFORM}"

      - name: Compile the Browser (ninja)
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          export PATH="$HOME/gn_bin:$HOME/depot_tools:$PATH"
          ninja -C "secondary_disk/out/android_${PLATFORM}" -j 2 chrome_public_apk

      - name: Uploading APK
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: apk-${{ matrix.platform }}
          path: secondary_disk/out/android_${{ matrix.platform }}/apks/*.apk

  sign_and_upload:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checking-out source-code for gh CLI access
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Downloading all APK artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: apk-*
          path: apks

      - name: Prepare release notes
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            if [ -f "./apks/apk-arm64/last_commits.txt" ]; then
              cat ./apks/apk-arm64/last_commits.txt
            else
              echo "Automated Relixor Build"
            fi
            
            cat <<EOT
          
          This version will replace your currently installed Relixor Browser.
          If you have important data, make sure to backup them or save them before upgrading to this version.
          
          This release was automatically generated from GitHub $REF in run ID $RUN_ID.
          
          Summary:
            - To install / update Relixor Browser, use "com.relixor.browser-arm64-${RUN_ID}-github.apk".
          
          Detailed information about the different files:
            - ".map" files are files that developers can use to investigate crashes (ProGuard mapping files).
            - ".apk" files are packages that you have to install to use Relixor Browser.
          EOT
          } > release_notes.txt

      - name: Rename APKs for release
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p release_assets
          for arch in arm arm64 x86 x64; do
            if [ -d "./apks/apk-${arch}" ]; then
              for apk_file in "./apks/apk-${arch}/"*.apk; do
                [ -e "$apk_file" ] || continue
                filename=$(basename "$apk_file")
                cp "$apk_file" "release_assets/com.relixor.browser-${arch}-${RUN_ID}-${filename}"
              done
            fi
          done

      - name: Creating GitHub Release and uploading assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh release create "$RUN_ID" release_assets/* \
            --title "Generation $RUN_ID" \
            --notes-file release_notes.txt \
            --prerelease

      - name: Send announcement on Discord
        continue-on-error: true
        if: contains(github.event.inputs.announceOnMessengers, 'yes')
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg username "Relixor Builder" \
            --arg content "A new build of Relixor Browser (preview version) is available. - https://github.com/${{ github.repository }}/releases/tag/${RUN_ID}" \
            '{username: $username, content: $content}')
            
          curl -H 'Content-Type: application/json' -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK"
      
      - name: Send announcement on Telegram
        continue-on-error: true
        if: contains(github.event.inputs.announceOnMessengers, 'yes')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg text "A new build of Relixor Browser (preview version) is available. Link: [${RUN_ID}](https://github.com/${{ github.repository }}/releases/tag/${RUN_ID})" \
            --arg chat_id "@relixorbuilds" \
            --arg parse_mode "markdown" \
            --argjson reply_markup "{
              \"inline_keyboard\": [
                [
                  {\"text\": \"arm64\", \"url\": \"https://github.com/${{ github.repository }}/releases/download/${RUN_ID}/com.relixor.browser-arm64-${RUN_ID}-github.apk\"}
                ]
              ]
            }" \
            '{text: $text, chat_id: $chat_id, parse_mode: $parse_mode, reply_markup: $reply_markup}')
            
          curl -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
