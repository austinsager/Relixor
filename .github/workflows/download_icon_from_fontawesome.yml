#checkov:skip=CKV_GHA_7:Admin-only manual inputs are required to choose and transform icon assets for Chromium
name: "Kiwi: Download icon from fontawesome"

on:
  #checkov:skip=CKV_GHA_7:Manual dispatch inputs are intentionally required to choose icon source and conversion target
  workflow_dispatch:
    inputs:
      iconNameFA:
        description: "Name of the icon in Fontawesome"
        required: true
      iconTypeFA:
        description: "Type of the icon in Fontawesome"
        required: true
      fillColor:
        description: "Edit fill/stroke color of the icon"
        required: false
      fileNameInChromium:
        description: "Name of the icon in Chromium"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "10.x"

      - name: Configure FA package
        id: fa-package
        env:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
        run: |
          if [ -n "$FONTAWESOME_NPM_AUTH_TOKEN" ]; then
            npm config set "@fortawesome:registry" https://npm.fontawesome.com/
            npm config set "//npm.fontawesome.com/:_authToken" "$FONTAWESOME_NPM_AUTH_TOKEN"
            echo "package=@fortawesome/fontawesome-pro@next" >> "$GITHUB_OUTPUT"
            echo "module_path=@fortawesome/fontawesome-pro" >> "$GITHUB_OUTPUT"
          else
            echo "package=@fortawesome/fontawesome-free@latest" >> "$GITHUB_OUTPUT"
            echo "module_path=@fortawesome/fontawesome-free" >> "$GITHUB_OUTPUT"
          fi
      - name: npm install FA package
        run: npm install --save ${{ steps.fa-package.outputs.package }}

      - name: Install librsvg2
        run: sudo apt install librsvg2-bin

      - name: Install ImageMagick
        run: sudo apt-get install imagemagick

      - name: Validate icon inputs
        env:
          ICON_NAME_FA: ${{ github.event.inputs.iconNameFA }}
          ICON_TYPE_FA: ${{ github.event.inputs.iconTypeFA }}
          FILE_NAME_IN_CHROMIUM: ${{ github.event.inputs.fileNameInChromium }}
          FILL_COLOR: ${{ github.event.inputs.fillColor }}
        run: |
          case "$ICON_TYPE_FA" in
            solid|regular|brands|light|duotone|thin|sharp-solid|sharp-regular|sharp-light) ;;
            *)
              echo "::error::Invalid Font Awesome icon type: $ICON_TYPE_FA"
              exit 1
              ;;
          esac

          if [[ ! "$ICON_NAME_FA" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Invalid icon name: $ICON_NAME_FA"
            exit 1
          fi

          if [ -z "$FILE_NAME_IN_CHROMIUM" ] || [[ "$FILE_NAME_IN_CHROMIUM" == */* ]] || [[ "$FILE_NAME_IN_CHROMIUM" == *$'\n'* ]]; then
            echo "::error::Invalid Chromium icon filename: $FILE_NAME_IN_CHROMIUM"
            exit 1
          fi

          if [ -n "$FILL_COLOR" ] && [[ ! "$FILL_COLOR" =~ ^#[0-9A-Fa-f]{3,8}$ ]]; then
            echo "::error::fillColor must be a hex color like #000, #fff, or #aabbccdd"
            exit 1
          fi

      - name: Execute Script - Replace icons with new FA ones
        env:
          MODULE_PATH: ${{ steps.fa-package.outputs.module_path }}
          ICON_NAME_FA: ${{ github.event.inputs.iconNameFA }}
          ICON_TYPE_FA: ${{ github.event.inputs.iconTypeFA }}
          FILE_NAME_IN_CHROMIUM: ${{ github.event.inputs.fileNameInChromium }}
          FILL_COLOR: ${{ github.event.inputs.fillColor }}
        run: |
          bash ./toolbox/icon_update_script.sh \
            "./node_modules/${MODULE_PATH}/svgs/${ICON_TYPE_FA}/${ICON_NAME_FA}.svg" \
            "$FILE_NAME_IN_CHROMIUM" \
            "$FILL_COLOR"

      - name: Git Auto Commit
        uses: stefanzweifel/git-auto-commit-action@v4.11.0
        with:
          # Commit message
          commit_message: Update ${{ github.event.inputs.fileNameInChromium }} with vetted Font Awesome icon import
          file_pattern: ./*.png
