#checkov:skip=CKV_GHA_7:Admin-only manual input is required to choose the repository file to purge from history
name: "Any branch: Delete a committed file"

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "The filename to delete (all history will be deleted for this file)"
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setting-up GitHub username
        run: |
          git config --global user.email "github@actions"
          git config --global user.name "Repository manager"

      - name: Deleting file from history
        env:
          FILENAME: ${{ github.event.inputs.filename }}
        run: |
          if [ -z "$FILENAME" ] || [ "${FILENAME#/}" != "$FILENAME" ] || [ "${FILENAME#../}" != "$FILENAME" ] || [[ "$FILENAME" == *"/../"* ]] || [[ "$FILENAME" == *"'"* ]] || [[ "$FILENAME" == *$'\n'* ]]; then
            echo "::error::Invalid file path: $FILENAME"
            exit 1
          fi
          export TARGET_FILE="$FILENAME"
          git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch -- "$TARGET_FILE"' --prune-empty --tag-name-filter cat -- --all

      - run: git push --force --all
